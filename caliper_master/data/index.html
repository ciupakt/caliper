<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKK Caliper 1.0</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Menu View -->
        <div id="menu-view" class="view">
            <h1>TKK Caliper 1.0</h1>
            <button onclick="showView('calibration')">Calibration</button>
            <button onclick="showView('session-name')">New Measurement Session</button>
        </div>

        <!-- Calibration View -->
        <div id="calibration-view" class="view hidden">
            <h1>Calibration</h1>

            <div class="status" id="cal-status"></div>

            <div class="result" id="calibration-measurement"></div>

            <input type="number" id="offset-input" min="-14.999" max="14.999" step="0.001" placeholder="calibrationOffset (-14.999..14.999)">

            <input type="number" id="reference-input" min="-999.999" max="999.999" step="0.001" placeholder="Reference (mm, -999.999..999.999)">

            <div class="button-group">
                <button onclick="calibrationMeasure()">Get Current Measurement</button>
                <button onclick="applyCalibrationOffset()">Apply Offset</button>
                <button onclick="applyReference()">Apply Reference</button>
                <button onclick="showView('menu')">Menu</button>
            </div>
        </div>

        <!-- Session Name View -->
        <div id="session-name-view" class="view hidden">
            <h1>New Measurement Session</h1>
            <input type="text" id="session-name-input" placeholder="Session name" autocomplete="off" autofocus>
            <button onclick="startSession()">Start</button>
            <button onclick="showView('menu')">Menu</button>
        </div>

        <!-- Measurement View -->
        <div id="measurement-view" class="view hidden">
            <h1>Session: <span id="session-name-display"></span></h1>

            <!-- By default we show the CORRECTED measurement (calculated in JS): measurementRaw + calibrationOffset -->
            <div class="measurement" id="measurement-value">No measurement</div>

            <div style="text-align: center; font-size: 16px; color: #666; margin: 10px 0;">
                Raw: <span id="measurement-raw">No data</span>
                | Offset: <span id="measurement-offset">No data</span>
                | Reference: <span id="measurement-reference">No data</span>
            </div>

            <div style="text-align: center; font-size: 18px; color: #666; margin: 10px 0;">
                Battery voltage: <span id="battery">No data</span>
            </div>
            <div style="text-align: center; font-size: 18px; color: #666; margin: 10px 0;">
                Vertical deviation: <span id="angle-z">No data</span>°
            </div>
            <button onclick="measureSession()">Take Measurement</button>

            <button onclick="showView('menu')">Menu</button>
            <div class="status" id="status"></div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
